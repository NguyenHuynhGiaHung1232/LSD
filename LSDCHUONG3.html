        /* --- CSS CHO NÚT SWITCH XÁO TRỘN --- */

        .question-text { font-weight: bold; margin-bottom: 10px; font-size: 16px; }
        .option-label { display: block; margin: 8px 0; padding: 10px; background: #fdfdfd; border: 1px solid #ddd; border-radius: 5px; cursor: pointer; transition: 0.2s; }

            q: "Câu 117. Hãy cho biết Việt Nam từ thế bị bao vây, cô lập đã chuyển sang giai đoạn hợp tác đối ngoại như thế nào trong thời kỳ đổi mới?",
            options: [

                "B. Đã mở rộng quan hệ ngoại giao với các nước trên thế giới, trở thành thành viên tích cực, có trách nhiệm của nhiều tổ chức quốc tế.",
                "C. Từ bỏ hoàn toàn các liên minh cũ để ký kết hiệp ước quân sự với Mỹ.",
                "D. Đóng cửa với thế giới phương Tây để tập trung phát triển nội lực."
            ],
            correct: 1
        },
        {
            q: "Câu 118. Quan điểm chỉ đạo và chủ trương xây dựng, phát triển nền văn hóa trong thời kỳ đổi mới là gì?",
            options: [
                "A. Tiếp thu toàn bộ văn hóa phương Tây để hiện đại hóa đất nước.",
                "B. Xây dựng nền văn hóa tiên tiến, đậm đà bản sắc dân tộc, thống nhất trong đa dạng của cộng đồng các dân tộc VN, với các đặc trưng dân tộc, nhân văn, dân chủ và khoa học.",
                "C. Bảo tồn văn hóa truyền thống bằng cách đóng cửa, không giao lưu văn hóa quốc tế.",
                "D. Xóa bỏ các phong tục tập quán cũ để xây dựng văn hóa công nghiệp."
            ],
            correct: 1
        },
        {
            q: "Câu 119. Đâu KHÔNG PHẢI là bản sắc của dân tộc Việt Nam?",
            options: [
                "A. Lòng yêu nước nồng nàn, ý chí tự cường dân tộc.",
                "B. Tinh thần đoàn kết, ý thức cộng đồng gắn kết cá nhân - gia đình - làng xã - Tổ quốc.",
                "C. Chủ nghĩa dân tộc hẹp hòi, bài ngoại cực đoan.",
                "D. Lòng nhân ái, khoan dung, trọng nghĩa tình, đạo lý."
            ],
            correct: 2
        },
        {
            q: "Câu 120. Năm 2019, Việt Nam được Đại hội đồng bầu đảm nhận vai trò quan trọng gì trong tổ chức Liên Hiệp quốc (nhiệm kỳ 2020 - 2021)?",
            options: [
                "A. Chủ tịch Đại hội đồng Liên Hiệp Quốc.",
                "B. Ủy viên thường trực của Hội đồng Bảo an Liên Hiệp Quốc.",
                "C. Ủy viên không thường trực của Hội đồng Bảo an Liên Hiệp Quốc.",
                "D. Tổng thư ký Liên Hiệp Quốc."
            ],
            correct: 2
        },
        {
            q: "Câu 121. Trong những thập niên 80 của thế kỷ XX, lực lượng FULRO phản động có nhiều hoạt động chia rẽ dân tộc và gây rối chủ yếu đối với khu vực nào của nước ta?",
            options: [
                "A. Khu vực Tây Bắc.",
                "B. Khu vực Đồng bằng sông Cửu Long.",
                "C. Khu vực Tây Nguyên.",
                "D. Khu vực Bắc Trung Bộ."
            ],
            correct: 2
        },
        {
            q: "Câu 122. Đại hội đại biểu toàn quốc lần thứ IV của Đảng (1976) đã đánh giá sự kiện nào đi vào lịch sử dân tộc ta như một trang chói lọi nhất?",
            options: [
                "A. Cách mạng tháng Tám năm 1945.",
                "B. Thắng lợi của cuộc kháng chiến chống Pháp (Điện Biên Phủ).",
                "C. Thắng lợi của cuộc kháng chiến chống đế quốc Mỹ, cứu nước (Đại thắng Mùa Xuân 1975).",
                "D. Sự kiện Việt Nam chính thức thống nhất hai miền Nam - Bắc."
            ],
            correct: 2
        },
        {
            q: "Câu 123. Nội dung nào sau đây KHÔNG PHẢI là quan điểm có tính nguyên tắc của Đảng ta?",
            options: [
                "A. Nguyên tắc tập trung dân chủ.",
                "B. Nguyên tắc tự phê bình và phê bình.",
                "C. Chấp nhận đa nguyên chính trị, đa đảng đối lập.",
                "D. Nguyên tắc kỷ luật nghiêm minh, tự giác."
            ],
            correct: 2
        },
        {
            q: "Câu 124. Hội nghị trung ương 8 (6/1985) được coi là bước đột phá thứ hai trong quá trình tìm tòi, đổi mới kinh tế của Đảng, thực chất đã thừa nhận nội dung gì?",
            options: [
                "A. Xóa bỏ hoàn toàn kinh tế quốc doanh.",
                "B. Xóa bỏ cơ chế quản lý kinh tế tập trung quan liêu bao cấp, thực hiện cơ chế một giá (xóa bao cấp trong giá và lương).",
                "C. Mở cửa hoàn toàn thị trường tài chính cho nhà đầu tư nước ngoài.",
                "D. Cho phép người dân sở hữu tư nhân về đất đai."
            ],
            correct: 1
        }
        ];
        // ... (mảng quizData của bạn ở trên) ...
        // ]; <-- Tìm đến vị trí này

        // === THÊM ĐOẠN CODE NÀY VÀO ĐỂ ĐẢO ĐÁP ÁN ===
        
        // Thuật toán đảo mảng ngẫu nhiên (Fisher-Yates)
        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        // Xử lý đảo đáp án cho toàn bộ câu hỏi
        quizData.forEach(item => {
            // 1. Tách nội dung và ghi nhớ đáp án đúng hiện tại
            let tempOptions = item.options.map((opt, idx) => {
                // Dùng Regex xóa các tiền tố "A. ", "B. ", "C. ", "D. " cũ
                let cleanText = opt.replace(/^[A-D]\.\s*/, ""); 
                return { 
                    text: cleanText, 
                    isCorrect: idx === item.correct // Lưu lại cờ nhận diện đáp án đúng
                };
            });

            // 2. Tiến hành đảo lộn ngẫu nhiên vị trí các câu trả lời
            shuffleArray(tempOptions);

            // 3. Gắn lại chữ cái A, B, C, D theo thứ tự mới và cập nhật dữ liệu
            const labels = ["A. ", "B. ", "C. ", "D. "];
            item.options = tempOptions.map((opt, idx) => labels[idx] + opt.text);
            
            // 4. Cập nhật lại chỉ mục (index) của đáp án đúng sau khi đã đảo
            item.correct = tempOptions.findIndex(opt => opt.isCorrect);
        });

        // === KẾT THÚC ĐOẠN CODE ĐẢO ĐÁP ÁN ===

        const quizContainer = document.getElementById('quiz');
        
        // Mảng lưu trữ thứ tự câu hỏi (mặc định là 0, 1, 2, 3...)
        let questionOrder = Array.from(quizData.keys()); 

        // Hàm vẽ danh sách câu hỏi ra màn hình
        function renderQuiz() {
            quizContainer.innerHTML = ''; // Xóa sạch nội dung cũ
            
            questionOrder.forEach((qIndex) => {
                const item = quizData[qIndex];
                const questionDiv = document.createElement('div');
                questionDiv.className = 'question-box';
                
                let optionsHTML = '';
                item.options.forEach((opt, optIndex) => {
                    optionsHTML += `
                        <label class="option-label" id="label-${qIndex}-${optIndex}">
                            <input type="radio" name="q${qIndex}" value="${optIndex}">
                            ${opt}
                        </label>
                    `;
                });

                questionDiv.innerHTML = `
                    <div class="question-text">${item.q}</div>
                    <div class="options" id="options-${qIndex}">
                        ${optionsHTML}
                    </div>
                `;
                quizContainer.appendChild(questionDiv);
            });
        }

        // Hàm xử lý khi ấn nút công tắc
        function toggleShuffleQuestions() {
            const isShuffled = document.getElementById('shuffleQuestionsToggle').checked;
            
            if (isShuffled) {
                // Nếu BẬT: Xáo trộn mảng thứ tự
                shuffleArray(questionOrder);
            } else {
                // Nếu TẮT: Khôi phục lại thứ tự gốc (0 -> 115)
                questionOrder = Array.from(quizData.keys());
            }
            
            // Xóa điểm số cũ đi (nếu đang xem điểm mà bấm xáo trộn)
            document.getElementById('result').innerText = '';
            
            // Vẽ lại toàn bộ câu hỏi theo thứ tự mới
            renderQuiz();
        }

        // --- Hàm chấm điểm (Giữ nguyên logic cũ) ---
        function checkAnswers() {
            let score = 0;
            quizData.forEach((item, index) => {
                const selectedOption = document.querySelector(`input[name="q${index}"]:checked`);
                
                // Xóa định dạng đúng/sai cũ
                item.options.forEach((_, optIndex) => {
                    const lbl = document.getElementById(`label-${index}-${optIndex}`);
                    if(lbl) lbl.classList.remove('correct', 'wrong');
                });

                if (selectedOption) {
                    const selectedValue = parseInt(selectedOption.value);
                    if (selectedValue === item.correct) {
                        score++;
                        document.getElementById(`label-${index}-${selectedValue}`).classList.add('correct');
                    } else {
                        document.getElementById(`label-${index}-${selectedValue}`).classList.add('wrong');
                        document.getElementById(`label-${index}-${item.correct}`).classList.add('correct');
                    }
                } else {
                    // Nếu không chọn, hiển thị đáp án đúng
                    const correctLbl = document.getElementById(`label-${index}-${item.correct}`);
                    if(correctLbl) correctLbl.classList.add('correct');
                }
            });

            document.getElementById('result').innerText = `Kết quả: Bạn trả lời đúng ${score} / ${quizData.length} câu!`;
            window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
        }

        // Chạy lần đầu tiên để hiển thị câu hỏi (thứ tự gốc)
        renderQuiz();
    </script>
